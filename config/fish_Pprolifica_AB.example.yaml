tools:
  Rscript: ../bin/Rscript_sif
  bash: /bin/bash
  bsub: ../bin/bsub_site
  samtools: ../bin/native/samtools
  bcftools: ../bin/native/bcftools
  gzip: /usr/bin/gzip
  curl: /usr/bin/curl
  ornaments: ../bin/native/ornaments
  python: ../bin/native/python
  personalizer: ../bin/native/personalizer
  singularity: ../bin/singularity_site
  r_library: /rsrch5/home/epi/bhattacharya_lab/software/R_package_library/ubuntu/4.3.1
  time: /usr/bin/time
ornaments:
  semantics: ref_alt
  threads: 2
execution:
  container_enabled: yes
  image: /risapps/singularity/repo/RStudio/4.3.1/rstudio_4.3.1.sif
  binds:
  - host: /rsrch5
    container: /rsrch5
    mode: rw
  - host: /rsrch9
    container: /rsrch9
    mode: rw
  - host: /tmp
    container: /tmp
    mode: rw
  backend: seadragon
  site_file: seadragon.sh
parents:
  focal: Line_A
  alternate: Line_B
dosage:
  maternal: 1.0
  paternal: 1.0
  rationale: diploid_tissue
reference:
  build: GCF_027474105.1  # P. prolifica RefSeq assembly
  contig_aliases: []
markers:
  mode: prepared
  source_type: RNAseq_called_fixed_difference_Line_A_Line_B_not_parental_DNA
  focal_sample: Line_A
  alternate_sample: Line_B
  duplicate_samples: []
  min_depth: 5.0
  min_allele_fraction: 0.9
  min_ref_fraction: 0.99
  chunk_rows: 10000
  proxy: no
  proxy_reason: ''
pilot:
  fragments: 1000000
  strand_fragments: 100000
  min_pseudoalignment_fraction: 0.2
  strand_tolerance: 0.05
fragments:
  fragment_mean_nt: 250
  fragment_sd_nt: 50
  fragment_parameter_origin: assumed_user_defined  # Only applies if curated runs are SE
retrieval:
  method: sra  # Use the NCBI SRA Toolkit rather than the unreliable ENA HTTPS FASTQs
  sra_threads: 2
  max_parallel_jobs: 2  # Limit simultaneous SRA cache and FASTQ conversion usage
  attempts: 3
  timeout_seconds: 1800
  connect_timeout_seconds: 30
  retry_seconds: 5
lsf:
  queue: short
  memory_units: GB
  stages:
    reference:
      memory_value: 8.0
      cpus: 2
      wall_time: '03:00'
      reservation_value: 8.0
      queue: short
    pilot:
      memory_value: 8.0
      cpus: 2
      wall_time: '03:00'
      reservation_value: 8.0
      queue: short
    scale:
      memory_value: 8.0
      cpus: 2
      wall_time: '12:00'
      reservation_value: 8.0
      queue: medium
    models:
      memory_value: 8.0
      cpus: 2
      wall_time: '03:00'
      reservation_value: 8.0
      queue: short
    retrieve:
      memory_value: 8.0
      reservation_value: 8.0
      cpus: 2.0
      wall_time: '06:00'
      queue: transfer
    # Editable starting allocations; size full-genome discovery from observed use.
    fish_repeats:
      queue: long
      cpus: 4
      memory_value: 64.0
      reservation_value: 64.0
      wall_time: '120:00'
models:
  min_depth: 10.0  # Exploratory; require >=3 callable units at one locus
  min_callable_units: 3
  min_families: 10
  min_orientation: 3
  bootstrap: 2000
  seed: 1147
  covariates: []
exports:
  enabled: no
  min_cell: ~
provenance_hints: []

# Optional regulatory analysis. Does not change primary pipeline stages.
regulatory:
  bootstrap: 2000
  seed: 1147
  min_depth: 10
  max_pairs_per_gene: 10
  fish:
    runtime: container
    image: /risapps/apptainer/repo/tetools/20240523/tetools-202405023.sif
    executable: apptainer
    seed: 1147
    cpus: 4
